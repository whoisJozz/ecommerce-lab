# Endurecimiento de Apache (Fase 1)
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>

# Archivos de configuración / infraestructura que NO deben servirse nunca
<FilesMatch "^(Dockerfile|\.dockerignore|.*\.(ini|conf|sql|md|log|env|bak|sh))$">
    Require all denied
</FilesMatch>

# Librerías internas y pruebas: solo se incluyen desde PHP, nunca se piden por URL
<FilesMatch "^(db|session_helper|jwt_helper|security_helper|totp|nav|tests_fase1)\.php$">
    Require all denied
</FilesMatch>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
</IfModule>
