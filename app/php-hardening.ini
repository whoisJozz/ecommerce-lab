; Endurecimiento de PHP (Fase 1)

; Ocultar información y no mostrar errores al usuario (ver: docker logs ecommerce_app)
expose_php = Off
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On

; Anti RCE: sin ejecución de comandos del sistema desde PHP
; (mail() sigue funcionando: usa sendmail_path internamente, no estas funciones)
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,show_source,highlight_file,phpinfo,posix_kill,posix_setuid

; Sin inclusión/lectura remota de archivos (RFI / SSRF vía file_get_contents)
allow_url_include = Off
allow_url_fopen = Off

; La aplicación solo puede tocar su directorio, /tmp (sesiones) y los includes de PHP
open_basedir = /var/www/html:/tmp:/usr/local/lib/php

; Sin subida de archivos y límites de entrada
file_uploads = Off
post_max_size = 1M
max_input_vars = 500

; Sesiones
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
